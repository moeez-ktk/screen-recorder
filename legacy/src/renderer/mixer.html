<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Audio mixer</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="mixer.css">
<body>
  <div class="panel">
    <header class="titlebar">
      <h1>Audio</h1>
      <div class="grow"></div>
      <button class="icon-btn" id="btnRefresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnClose" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="scroll" id="scroll">
      <section>
        <h2>Capture</h2>
        <div id="capture"></div>
      </section>

      <section>
        <h2>Applications <span class="note" id="appsNote"></span></h2>
        <div id="apps"><div class="loading">Reading audio sessions…</div></div>
      </section>

      <section>
        <h2>Browser tabs</h2>
        <div id="tabs"></div>
      </section>
    </div>

    <footer class="foot" id="foot"></footer>
  </div>

  <script src="common.js"></script>
  <script src="mixer.js"></script>
</body>
</html>
